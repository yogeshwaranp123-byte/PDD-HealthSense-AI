name: Generate Excel Reports

on:
  push:
    branches:
      - main
    paths:
      - 'run_e2e_tests.py'
      - 'backend/generate_security_report.py'
      - '.github/workflows/generate-excel-reports.yml'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  build-reports:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true


    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl

      - name: Run E2E Test Report Generator
        run: python run_e2e_tests.py --simulate

      - name: Run Security Report Generator
        run: python backend/generate_security_report.py

      - name: Upload Excel Reports as Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Excel-Reports-Archive
          path: |
            *.xlsx
            Vulnerability Test Results/*.xlsx
